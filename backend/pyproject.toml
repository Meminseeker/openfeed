[project]
name = "openfeed-backend"
version = "0.1.0"
description = "Local-first social media feed aggregator backend (YouTube, TikTok, experimental X/Instagram)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "feedparser>=6.0",
    "yt-dlp>=2025.1.1",
    "apscheduler>=3.10,<4.0",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "curl-cffi>=0.7",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
