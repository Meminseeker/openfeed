name: openfeed
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      OPENFEED_PUBLIC_ORIGIN: https://${OPENFEED_DOMAIN:?Set OPENFEED_DOMAIN in .env}
      OPENFEED_RETENTION_DAYS: ${OPENFEED_RETENTION_DAYS:-7}
      OPENFEED_SETUP_TOKEN: ${OPENFEED_SETUP_TOKEN:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
      INSTAGRAM_GRAPH_VERSION: ${INSTAGRAM_GRAPH_VERSION:-}
      PATREON_SESSION_ID: ${PATREON_SESSION_ID:-}
      PATREON_OPENFEED_USER: ${PATREON_OPENFEED_USER:-}
    volumes:
      - app_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "require('node:http').get({host:'127.0.0.1',port:3000,path:'/healthz',headers:{host:new URL(process.env.OPENFEED_PUBLIC_ORIGIN).host}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      OPENFEED_DOMAIN: ${OPENFEED_DOMAIN:?Set OPENFEED_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  app_data:
  caddy_data:
  caddy_config:
